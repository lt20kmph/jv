{% extends 'base.html' %}
{% block title %}Forgot password{% endblock title %}
{% block body %}
<form method="post" action="/forgot_password">
  <div class="container montserrat-body">
    <h2>Forgot password</h2>
    <hr>
    <p>Enter the email you signed up with and we'll send you a link to reset your password.</p>
    <label for="email"><b>Email</b></label>
    <input type="email" class="login-input" placeholder="Enter Email" name="email" required>
    <button type="submit">Send reset link</button>
    <p style="text-align: center; margin-top: 1rem;">Remembered it? <a href="/login">Log in</a></p>
  </div>
</form>
{% endblock body %}
